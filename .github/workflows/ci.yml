name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      # The renderer tests assert through the theme's tokens, so the suite is
      # run again in each palette that changes what a token holds.
      - run: cargo test --all-targets
        env:
          NO_COLOR: 1
      - run: cargo test --all-targets
        env:
          AZ_TUI_THEME: terminal-light
      - run: cargo test --all-targets
        env:
          AZ_TUI_THEME: mono
      - run: cargo build --release
      # The whole program under a pty against the fake kubectl: what a person
      # would see, asserted from the screen.
      - run: pip install pyte && python3 scripts/walk.py
        if: runner.os == 'Linux'
      # The README tells people to install it this way, so the install path
      # is proven rather than assumed.
      - run: cargo install --path . --locked --root ${{ runner.temp }}/install
      - run: ${{ runner.temp }}/install/bin/az-tui --version
