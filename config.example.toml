# az-tui — copy to ~/.config/az-tui/config.toml and edit. Every key is
# optional, and so is the whole file. ($XDG_CONFIG_HOME/az-tui/config.toml
# when that is set; the same path on macOS.)
#
# A flag beats an AZ_TUI_* variable, which beats this file.

# ── AKS ──────────────────────────────────────────────────────────────────
# Seconds between reads of the open AKS tab; the other tabs are read every
# 30 s for their badges. 0 leaves `r` as the only read. This line must stay
# above the first [[clusters]] block, or TOML gives it to that cluster.
# refresh = 5

# One tab per namespace, in this order, ahead of Secrets and Registries.
# `context` is the kubeconfig context kubectl reaches the cluster by —
# `az-tui setup` writes one per cluster and prints these blocks — and is the
# cluster's name when left out. A cluster with no `namespaces` is one tab
# over all of them. No [[clusters]] at all: no AKS tabs.

[[clusters]]
name = "qa"
context = "aks-qa"
namespaces = ["dev", "qa", "uat"]

[[clusters]]
name = "prod"
context = "aks-prod"
namespaces = ["prod"]

# ── Key Vault and Container Registry ─────────────────────────────────────
[azure]
# Only read these subscriptions. Left out: every subscription `az` can see.
# subscriptions = ["00000000-0000-0000-0000-000000000000"]

# Only read these key vaults, in this order. Left out: every vault found.
# A name that is not found is listed by `az-tui doctor` under `not found`,
# which then exits 1.
# vaults = ["kv-dev", "kv-qa", "kv-prod"]

# Only read these container registries, in this order. Left out: all of them.
# registries = ["acrdev", "acrqa", "acrprod"]

# Seconds between background refreshes of the vaults and registries; 0 leaves
# `r` as the only refresh. No flag sets this one — `--refresh` is the AKS
# cadence above.
# refresh = 300

# How many vaults, registries or repositories a refresh reads at once.
# Turn it down if a Basic-tier registry with many repositories throttles.
# parallel = 8

[theme]
# terminal · terminal-light · mono · custom
# preset = "terminal"

# A palette in the `theme` tool's vocabulary — the same table ticket-tui
# reads, so one file themes both. `preset = "custom"` is implied when this
# table is here and no preset is named.
# [theme.custom]
# name = "neon-void"
# appearance = "dark"      # dark · light
# bg = "#05060a"
# bg_deep = "#000000"
# surface = "#0b0d14"
# overlay = "#171b28"
# fg = "#dfe6ff"
# subtle = "#aab4dd"
# muted = "#626c9c"
# accent = "#c07cff"
# red = "#ff5f87"
# green = "#4ef5a4"
# yellow = "#ffd75f"
# blue = "#61a8ff"
# cyan = "#4fe8ff"
# orange = "#ff9e5e"
# teal = "#29e0c8"
